<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/favicon-192.png" />
    <link rel="apple-touch-icon" href="./src/assets/favicon-192.png" />
    <!-- Fuentes alojadas en el sitio (no bloquean la carga como las de Google) y fotos de Cloudinary -->
    <link rel="preload" href="/fonts/roboto-slab-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo-black-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <!-- Catálogo: se pide en paralelo con el JavaScript (lo usan todas las páginas) -->
    <link rel="preload" href="/catalog.json" as="fetch" crossorigin />
    <!-- Foto de la portada: se pide de entrada (en las otras páginas, scripts/prerender.mjs saca esta línea) -->
    <link rel="preload" as="image" href="/images/hero-blur-1024.webp" imagesrcset="/images/hero-blur-640.webp 640w, /images/hero-blur-1024.webp 1024w, /images/hero-blur-1600.webp 1600w" imagesizes="100vw" fetchpriority="high" data-hero-preload />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1917" />
    <title>Los Molinos Regionales</title>
    <meta name="description" content="Accesorios para parrilla en Dolores, Buenos Aires: sets de asador, tablas de madera y planchetas. Pedidos por WhatsApp, retiro en el local o entrega en Dolores." />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Vista previa al compartir el link (WhatsApp, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Los Molinos Regionales" />
    <meta property="og:title" content="Los Molinos Regionales | Accesorios para tu parrilla" />
    <meta property="og:description" content="Sets de asador, tablas de madera y planchetas en Dolores. Pedí por WhatsApp." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Los Molinos Regionales: accesorios para tu parrilla en Dolores, Buenos Aires. Pedidos por WhatsApp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Datos del negocio para Google (búsquedas locales) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Los Molinos Regionales",
        "description": "Accesorios para parrilla: sets de asador, tablas de madera y planchetas.",
        "url": "%SITE_URL%/",
        "image": "%SITE_URL%/og-image.jpg",
        "telephone": "+5492245502977",
        "email": "lmregionales@gmail.com",
        "paymentAccepted": "Transferencia bancaria, Efectivo",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Aristóbulo del Valle 178",
          "addressLocality": "Dolores",
          "addressRegion": "Buenos Aires",
          "postalCode": "B7100",
          "addressCountry": "AR"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -36.3172659,
          "longitude": -57.6767455
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
            "opens": "09:00",
            "closes": "13:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "17:00",
            "closes": "21:00"
          }
        ],
        "areaServed": "Dolores, Buenos Aires",
        "sameAs": [
          "https://www.instagram.com/lmregionales/",
          "https://www.facebook.com/listo.elpollo.54"
        ]
      }
    </script>
  </head>
  <body>
    <!-- La foto de portada ya está en el HTML: se pinta apenas llega, sin esperar a React. Misma posición
         y tamaño que la portada de la app (components/hero.jsx), que la reemplaza al arrancar sin que se note.
         En las otras páginas, scripts/prerender.mjs la saca -->
    <div id="root"><div data-static-hero style="padding-top:6rem"><img src="/images/hero-blur-1024.webp" srcset="/images/hero-blur-640.webp 640w, /images/hero-blur-1024.webp 1024w, /images/hero-blur-1600.webp 1600w" sizes="100vw" width="1600" height="1142" alt="" fetchpriority="high" style="display:block;width:100%;height:78dvh;min-height:32rem;max-height:48rem;object-fit:cover" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
